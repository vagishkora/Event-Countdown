<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HackDays Control Room</title>
  <link rel="stylesheet" href="/admin.css">
</head>

<body>
  <div class="admin-shell">

    <header>
      <div>
        <span class="eyebrow">HACKDAYS CONTROL ROOM</span>
        <h1>Event Countdown</h1>
      </div>

      <div class="header-actions">
        <button id="editBtn" class="ghost">Edit</button>
        <button id="cancelEditBtn" class="ghost hidden">Cancel</button>
        <button id="stopBtn" class="danger">Stop Event</button>
      </div>
    </header>

    <div id="panel">

      <!-- EVENT SCHEDULE -->
      <section class="card">
        <div class="card-head">
          <h2>Event schedule</h2>
          <span id="saveState">Not saved</span>
        </div>

        <label>
          Event name
          <input id="eventName" disabled>
        </label>

        <div class="grid2">
          <label>
            Start
            <input id="start" type="datetime-local" disabled>
          </label>

          <label>
            End
            <input id="end" type="datetime-local" disabled>
          </label>
        </div>

        <div class="button-row">
          <button id="saveBtn" disabled>Publish schedule</button>
        </div>

        <div id="formError" class="error"></div>
      </section>


      <!-- MILESTONES -->
      <section class="card">
        <div class="card-head">
          <h2>Milestones</h2>
          <button id="addMilestone" class="small" disabled>+ Add</button>
        </div>

        <div id="milestones"></div>
      </section>


      <!-- ANNOUNCEMENTS -->
      <section class="card">
        <div class="card-head">
          <h2>Announcements</h2>
          <button id="addAnnouncement" class="small" disabled>+ Add</button>
        </div>

        <div id="announcements"></div>
      </section>

    </div>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
