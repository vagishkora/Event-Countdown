<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Countdown Admin</title><link rel="stylesheet" href="/admin.css"></head><body><div class="admin-shell"><header><div><span class="eyebrow">CONTROL ROOM</span><h1>Event Countdown</h1></div><button id="previewBtn" class="ghost">Test phases</button></header><div id="panel"><section class="card"><div class="card-head"><h2>Event schedule</h2><span id="saveState">Not saved</span></div><label>Event name<input id="eventName"></label><div class="grid2"><label>Start<input id="start" type="datetime-local"></label><label>End<input id="end" type="datetime-local"></label></div><button id="saveBtn">Publish schedule</button><div id="formError" class="error"></div></section><section class="card"><div class="card-head"><h2>Milestones</h2><button id="addMilestone" class="small">+ Add</button></div><div id="milestones"></div></section><section class="card"><div class="card-head"><h2>Announcements</h2><button id="addAnnouncement" class="small">+ Add</button></div><div id="announcements"></div></section><section class="card preview-card"><div class="preview-label">LIVE PREVIEW</div><div id="previewPhase">—</div><div id="previewTimer">00:00:00</div></section></div></div><script src="/admin.js"></script></body></html>
